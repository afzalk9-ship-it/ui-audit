# malomatia UI Audit — free automated browser testing (Chrome, Edge, Firefox, Safari/WebKit)
# Runs on every pull request and on demand (Actions → malomatia UI Audit → Run workflow).
# Results appear automatically in malomatia UI Audit Studio.
name: malomatia UI Audit
on:
  pull_request:
  workflow_dispatch:
jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test browsers
        run: curl -fsSL https://malomatia-ux-audit-hub.lovable.app/ci/install.sh | bash -s https://malomatia-ux-audit-hub.lovable.app
      - name: Run malomatia UI audit
        working-directory: malomatia-ci
        env:
          MALOMATIA_AUDIT_TOKEN: ${{ secrets.MALOMATIA_AUDIT_TOKEN }}
          MALOMATIA_AUDIT_ID: "c4p49q4a"
          MALOMATIA_API: https://malomatia-ux-audit-hub.lovable.app/api/public/ui-test
          TEST_URLS: "https://beta.npc.qa/EN/Pages/default.aspx?g=c260ef26-23a9-40aa-9ff9-cd5200e77df3"
          TEST_URL_AR: "https://beta.npc.qa/AR/Pages/default.aspx?g=c260ef26-23a9-40aa-9ff9-cd5200e77df3"
          REPO_DIR: ${{ github.workspace }}
        run: node run.mjs
